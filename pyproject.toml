[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-camera-lab"
version = "0.1.0"
description = "Local camera analytics prototype with open-set face matching and a synthetic demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
media = ["opencv-python-headless>=4.10,<6", "Pillow>=11,<13"]
# Real CV path (Pi 5 / dev box). Heavy deps stay optional + lazily imported so
# the fake/synthetic test path runs with numpy alone.
cv = [
    "opencv-python-headless>=4.10,<6",
    "Pillow>=11,<13",
    "onnxruntime>=1.18,<2",
    "insightface>=0.7.3,<0.8",
]
# Pi camera (usually already system-installed via apt on Raspberry Pi OS).
pi = [
    "picamera2>=0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",  # fastapi TestClient transport
]

[tool.setuptools.packages.find]
include = ["edge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# web.py embeds the whole UI as one HTML/CSS/JS template string; 100-col wrapping
# of CSS rules and JS template literals hurts readability more than it helps.
"edge/web.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
